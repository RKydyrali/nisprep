name: danyshpan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-danyshpan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-danyshpan}
    command:
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-danyshpan} -d ${POSTGRES_DB:-danyshpan}"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 256m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-danyshpan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-danyshpan}
      REDIS_URL: redis://redis:6379/0
      ENV: prod
      DEBUG: "false"
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for postgres...' &&
      cd /app && python -m app.db.wait_for_db &&
      alembic upgrade head &&
      python -m app.seed &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  bot:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-danyshpan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-danyshpan}
      REDIS_URL: redis://redis:6379/0
      ENV: prod
      DEBUG: "false"
    command: >
      /bin/sh -c "cd /app && python -m app.db.wait_for_db && exec python -m app.bot.worker"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ru"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
